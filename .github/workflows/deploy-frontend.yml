name: Deploy Frontend (Next.js) to VPS

# Builds and releases the Next.js app on the VPS over SSH.
# The production build (npm ci + next build) runs on the server, then the
# process is (re)started with pm2. Nothing is built or run on a local machine.

on:
  push:
    branches: [frontend]
  workflow_dispatch:

# Never let two frontend deploys run at the same time.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_PATH: /var/www/Prakerin-FE
  DEPLOY_BRANCH: frontend
  PM2_APP: prakerin-fe

jobs:
  deploy:
    name: Build & release on VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 40m
          script_stop: true
          script: |
            set -e
            echo "==> Releasing Prakerin-FE -> ${{ env.DEPLOY_PATH }} (origin/${{ env.DEPLOY_BRANCH }})"
            cd "${{ env.DEPLOY_PATH }}"

            echo "==> [1/4] Sync code"
            git fetch --all --prune
            git reset --hard "origin/${{ env.DEPLOY_BRANCH }}"

            echo "==> [2/4] Install dependencies (clean, reproducible)"
            npm ci --no-audit --no-fund

            echo "==> [3/4] Production build"
            # 2 GB VPS: cap Node heap below total RAM and lean on swap.
            export NODE_OPTIONS="--max-old-space-size=1536"
            export NEXT_TELEMETRY_DISABLED=1
            npm run build

            echo "==> [4/4] (Re)start app with pm2"
            if pm2 describe "${{ env.PM2_APP }}" >/dev/null 2>&1; then
              pm2 reload "${{ env.PM2_APP }}" --update-env
            else
              pm2 start npm --name "${{ env.PM2_APP }}" -- start
            fi
            pm2 save

            echo "==> Health check (http://127.0.0.1:3000)"
            sleep 3
            curl -fsS --max-time 10 http://127.0.0.1:3000 >/dev/null \
              && echo "Health OK" \
              || echo "WARN: app not answering on :3000 yet — check 'pm2 logs ${{ env.PM2_APP }}'."

            echo "==> Frontend deploy complete."
